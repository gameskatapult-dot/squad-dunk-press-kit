<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-l10n="ui.page.home_title">DUNK — Katapult Games</title>
    <meta name="description" data-l10n-content="description.short.text" content="A first-person basketball game for 1–6 players.">
    <link rel="canonical" href="https://squaddunk.com/">
    <meta property="og:title" data-l10n-content="ui.page.home_title" content="DUNK — Katapult Games">
    <meta property="og:description" data-l10n-content="description.short.text" content="A first-person basketball game for 1–6 players.">
    <meta property="og:image" content="https://squaddunk.com/presskit/images/key-art-2026-web.jpg">
    <link rel="icon" href="./presskit/images/favicon-hand.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/dunk.css?v=20261027-graphite">
  </head>
  <body class="dunk home">
    <header class="topbar" data-l10n-aria-label="ui.accessibility.primary">
      <div class="topbar__inner">
        <a class="topbar__brand" href="./" data-language-link data-l10n-aria-label="ui.accessibility.home" aria-label="Katapult Games home">
          <img src="./presskit/images/dunk-logo-v8.png" alt="DUNK" width="95" height="28">
        </a>
        <nav class="topbar__nav" data-l10n-aria-label="ui.accessibility.navigation" aria-label="Main navigation">
          <a href="./presskit/" data-language-link data-l10n="ui.landing.nav.press">Press</a>
        </nav>
        <div class="topbar__actions">
          <label class="visually-hidden" for="home-language" data-l10n="ui.nav.language">Language</label>
          <select class="topbar__language" id="home-language" data-language-select data-l10n-aria-label="ui.accessibility.language" aria-label="Choose language">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="ru">Русский</option>
            <option value="ja">日本語</option>
            <option value="zh">简体中文</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="pt">Português</option>
          </select>
        </div>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero__media">
          <video class="hero__video" data-hero-video autoplay muted loop playsinline preload="auto"
            src="./presskit/images/announcement/hero-loop-pingpong.mp4" poster="./presskit/images/announcement/hero-poster.jpg"
            data-src-default="./presskit/images/announcement/hero-loop-pingpong.mp4" data-poster-default="./presskit/images/announcement/hero-poster.jpg"
            data-src-zh="./presskit/images/announcement/playtest-loop-zh.mp4" data-poster-zh="./presskit/images/announcement/playtest-poster-zh.jpg"
            data-l10n-aria-label="ui.hero.video_label" aria-label="DUNK playtest announcement video"></video>
          <button class="hero__toggle" type="button" data-hero-toggle data-l10n-aria-label="ui.hero.pause" aria-label="Pause video" aria-pressed="false">
            <svg class="hero__icon-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h3v12H4zM9 2h3v12H9z" fill="currentColor"/></svg>
            <svg class="hero__icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg>
          </button>
        </div>
      </section>
      <section class="intro sky" aria-labelledby="home-title">
        <div class="container intro__inner">
          <h1 id="home-title" class="visually-hidden">DUNK</h1>
          <p class="intro__tagline" data-l10n="ui.landing.tagline">First-person basketball for 1–6 players. From 1v1 to 3v3.</p>
          <div class="intro__actions">
            <a class="button button--ball" href="https://store.steampowered.com/app/4591520/Squad_Dunk/" target="_blank" rel="noopener" data-analytics-event="Steam Click">
              <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-9.96 9.2l5.36 2.22a2.8 2.8 0 0 1 1.6-.5h.16l2.39-3.46v-.05a3.78 3.78 0 1 1 3.78 3.78h-.09l-3.4 2.43v.13a2.84 2.84 0 0 1-5.62.57L2.38 14.8A10 10 0 1 0 12 2Zm-4.72 15.2-1.23-.51a2.13 2.13 0 1 0 1.17-2.9l1.27.53a1.57 1.57 0 1 1-1.2 2.9Zm9.47-7.75a2.52 2.52 0 1 0-2.52 2.52 2.52 2.52 0 0 0 2.52-2.52Zm-4.4 0a1.89 1.89 0 1 1 1.89 1.89 1.89 1.89 0 0 1-1.9-1.89Z"/></svg>
              <span data-l10n="ui.hero.steam_cta">Sign up for the playtest</span>
            </a>
            <a class="button button--cloud" href="./presskit/" data-language-link>
              <span data-l10n="ui.landing.press_kit_cta">Press kit</span>
            </a>
          </div>
        </div>
      </section>
      <div class="scene scene--world" data-scene aria-hidden="true">
        <img class="scene__layer" data-depth="-0.10" src="./presskit/images/scene/sky.webp" alt="" loading="lazy" width="2400" height="1375">
        <img class="scene__layer" data-depth="0.02" src="./presskit/images/scene/far.webp" alt="" loading="lazy" width="2400" height="1375">
        <img class="scene__layer" data-depth="0.12" src="./presskit/images/scene/trees.webp" alt="" loading="lazy" width="2400" height="1375">
        <img class="scene__layer" data-depth="0.34" src="./presskit/images/scene/front.webp" alt="" loading="lazy" width="2400" height="1375">
      </div>
    </main>
    <footer class="site-footer">
      <div class="container site-footer__inner">
        <span class="site-footer__studio">
          <img src="./presskit/images/katapult-logo.png" alt="Katapult Games" width="40" height="40">
          <span>© Katapult Games</span>
        </span>
      </div>
    </footer>
    <script id="presskit-localization" type="application/json" data-src="./localization.json"></script>
    <script src="./js/presskit-page.js?v=20261027-graphite"></script>
  </body>
</html>
