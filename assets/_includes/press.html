<section class="press community--press" id="press" aria-labelledby="press-title" data-press data-src="../community/press.json" hidden>
  <div class="container">
    <span class="community__eyebrow" data-l10n="ui.nav.sections.press">Press</span>
    <h2 id="press-title" class="title" data-l10n="ui.press.title">What the press is saying</h2>
    <p class="community__total"><strong data-press-articles></strong> <span data-l10n="ui.press.articles_label">articles</span> · <strong data-press-languages></strong> <span data-l10n="ui.press.languages_label">languages</span></p>
    <div class="community__viewport">
      <ul class="press__rail" data-press-list></ul>
      <button class="community__arrow community__arrow--prev" type="button" data-press-prev data-l10n-aria-label="ui.press.prev" aria-label="Previous articles"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
      <button class="community__arrow community__arrow--next" type="button" data-press-next data-l10n-aria-label="ui.press.next" aria-label="Next articles"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.6 18.6 10 20l8-8-8-8-1.4 1.4 6.6 6.6z"/></svg></button>
    </div>
  </div>
</section>
