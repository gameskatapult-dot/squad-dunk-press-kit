{{#if presskit.manifestScreenshots}}
<section class="band jungle band--media" aria-labelledby="media">
  <div class="container">
    <header class="band__header">
      <h2 id="media" class="title" data-l10n="ui.media.screenshots">Screenshots</h2>
      {{#if presskit.mediaDownloadFile}}
      <a class="button button--cloud button--small" href="{{presskit.mediaDownloadFile}}" download data-analytics-event="Press Kit Download">
        <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 3h2v10.17l3.59-3.58L18 11l-6 6-6-6 1.41-1.41L11 13.17zM4 19h16v2H4z"/></svg>
        <span data-l10n="ui.media.download">{{presskit.mediaDownloadTitle}}</span>
      </a>
      {{/if}}
    </header>
    <ul class="shots" id="screenshots">
      {{#each presskit.manifestScreenshots}}
      <li class="shot{{#if featured}} shot--featured{{/if}}">
        <a class="frame" href="{{file}}" data-gallery="screenshots" data-l10n-data-gallery-title="ui.media.items.{{@index}}.title" data-gallery-title="{{title}}">
          <img src="{{preview}}" data-l10n-alt="ui.media.items.{{@index}}.alt" alt="{{alt}}" loading="lazy" width="1600" height="900">
        </a>
        <p class="shot__meta">
          <span data-l10n="ui.media.items.{{@index}}.title">{{title}}</span>
          <a href="{{file}}" download data-analytics-event="Assets Download">{{caption}}</a>
        </p>
      </li>
      {{/each}}
    </ul>
  </div>
</section>
{{/if}}
