<section class="band cream band--about" aria-labelledby="factsheet">
  <div class="container">
    <h2 id="factsheet" class="title" data-l10n="description.heading">{{presskit.descriptionHeading}}</h2>

    <div class="overview">
      <div class="overview__copy" id="description">
        {{#each presskit.longDescriptions}}
        <p class="lead" data-l10n="description.long.paragraphs.{{@index}}">{{.}}</p>
        {{/each}}
      </div>

    </div>

    {{#if presskit.keyFeatures}}
    <div class="about-game">
      {{#each presskit.keyFeatures}}
      <article class="feature">
        {{#with (lookup ../presskit.featureVideos @index)}}
        <figure class="feature__media"><video src="{{file}}" poster="{{poster}}" autoplay muted loop playsinline preload="metadata" width="1400" height="400" aria-hidden="true"></video></figure>
        {{/with}}
        <div class="feature__text">
          <h3 class="feature__title" data-l10n="description.keyFeatures.{{@index}}.title">{{title}}</h3>
          <p class="feature__body" data-l10n="description.keyFeatures.{{@index}}.body">{{body}}</p>
        </div>
      </article>
      {{/each}}
    </div>
    {{/if}}

  </div>
</section>
