<section class="community community--press" id="creators" aria-labelledby="creators-title" data-community data-src="../community/community.json" hidden>
  <div class="container">
    <span class="community__eyebrow" data-l10n="ui.nav.sections.creators">Creators</span>
    <h2 id="creators-title" class="title" data-l10n="ui.community.title">Creators are playing DUNK</h2>
    <p class="community__total"><strong data-community-total></strong> <span data-l10n="ui.community.views_label">views on creator videos</span></p>
    <div class="community__viewport" data-community-viewport>
      <ul class="community__rail" data-community-list></ul>
      <button class="community__arrow community__arrow--prev" type="button" data-community-prev data-l10n-aria-label="ui.community.prev" aria-label="Previous clips"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
      <button class="community__arrow community__arrow--next" type="button" data-community-next data-l10n-aria-label="ui.community.next" aria-label="Next clips"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.6 18.6 10 20l8-8-8-8-1.4 1.4 6.6 6.6z"/></svg></button>
    </div>
    <button class="button button--cloud community__more" type="button" data-community-more hidden data-analytics-event="Community See All">
      <span data-l10n="ui.community.see_all">See all clips</span> <span data-community-count-all></span>
    </button>
  </div>
</section>
