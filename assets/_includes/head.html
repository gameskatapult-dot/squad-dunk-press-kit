<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

{{#if company.title}}
<title {{#if isProduct}}data-l10n="ui.page.title"{{/if}}>{{presskit.title}} - {{company.title}}</title>
{{else}}
<title>{{presskit.title}}</title>
{{/if}}

{{#if isProduct}}
<meta name="description" data-l10n-content="description.short.text" content="{{presskit.shortDescription}}">
<meta property="og:title" data-l10n-content="ui.page.title" content="{{presskit.title}} — Katapult Games">
<meta property="og:description" data-l10n-content="description.short.text" content="{{presskit.shortDescription}}">
<meta property="og:image" content="https://i.ytimg.com/vi/c2TyYF3-3dQ/maxresdefault.jpg">
<meta property="og:video" content="https://www.youtube.com/watch?v=c2TyYF3-3dQ">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://dunkthegame.com/presskit/">
<link rel="shortcut icon" href="images/favicon-hand.png">
<link rel="apple-touch-icon" href="images/logo-site-icon.png">
{{else}}
<link rel="shortcut icon" href="images/favicon.ico?t={{buildTime}}">
{{/if}}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{assets}}/css/normalize.css">
{{#if isProduct}}
<link rel="stylesheet" href="{{assets}}/css/dunk.css?v={{buildTime}}">
{{else}}
<link rel="stylesheet" href="{{assets}}/css/theme.css">
<link rel="stylesheet" href="{{assets}}/css/refresh.css?v={{buildTime}}">
{{/if}}
<link rel="stylesheet" href="{{assets}}/css/print.css" media="print">

<!-- GoatCounter endpoint (validated, non-placeholder). presskit-page.js loads count.js only on the production host. -->
{{#if presskit.goatcounterEndpoint}}
<meta name="goatcounter" content="{{presskit.goatcounterEndpoint}}">
{{/if}}

<!-- Generated by presskit.html {{buildVersion}} (https://github.com/pixelnest/presskit.html). -->
