{{#if presskit.brandingAssets}}
<section class="band cream band--follow" aria-labelledby="logo">
  <div class="container">
    <header class="band__header">
      <h2 id="logo" class="title" data-l10n="ui.branding.title">Key art & logos</h2>
      {{#if presskit.brandingDownloadFile}}
      <a class="button button--leaf button--small" href="{{presskit.brandingDownloadFile}}" download data-analytics-event="Assets Download">
        <svg class="button__icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 3h2v10.17l3.59-3.58L18 11l-6 6-6-6 1.41-1.41L11 13.17zM4 19h16v2H4z"/></svg>
        <span data-l10n="ui.branding.download">{{presskit.brandingDownloadTitle}}</span>
      </a>
      {{/if}}
    </header>
    <ul class="brand-assets">
      {{#each presskit.brandingAssets}}
      <li class="download download--{{type}}">
        <a class="download__image" href="{{file}}" download data-analytics-event="Assets Download">
          <img src="{{file}}" data-l10n-alt="ui.branding.assets.{{@index}}.alt" alt="{{alt}}" loading="lazy">
        </a>
        <p class="download__meta">
          <span data-l10n="ui.branding.assets.{{@index}}.title">{{title}}</span>
        </p>
      </li>
      {{/each}}
    </ul>
  </div>
</section>
{{/if}}
