    de:
      description:
        heading: WAS IST DUNK?
        short:
          title: KURZBESCHREIBUNG
          text: Ein First-Person-Basketballspiel für 1⁠–⁠6 Spieler, bei dem jeder physikbasierte Pass,
            Block und DUNK auf Können ankommt. Entdecke einzigartige Courts im ganzen
            Universum, quatsche im Proximity-Chat oder feile im Solospiel an deinen
            Fähigkeiten. Schalte neue Looks, Emotes und mehr frei, um vor deinen Freunden
            anzugeben!
        long:
          title: LANGE BESCHREIBUNG
          paragraphs:
            - "First-Person-Basketball für 1⁠–⁠6 Spieler in Matches von 1v1 bis 3v3.
              Verbring Zeit mit Freunden im Proximity-Chat oder lass dein Können sprechen:
              abfangen, tackeln, passen und DUNK."
        keyFeaturesTitle: Hauptfeatures
        keyFeatures:
          - icon: ""
            title: SPIEL DIREKT VOM COURT
            body: Steuere einen Spieler in der First-Person-Perspektive und erlebe das Match mitten
              aus der Action heraus, nicht aus einer entfernten Kamera.
          - icon: ""
            title: SPÜRE DIE PHYSIK
            body: Physikbasierte Mechaniken machen Basketball lebendiger, körperlicher und
              unvorhersehbarer. Blocks, Würfe, Steals, Rebounds, Bewegung und Kontakt
              werden Teil jedes Moments.
          - icon: ""
            title: SPIEL ALS TEAM
            body: Spiele solo oder mit Freundinnen und Freunden in lockeren oder kompetitiven Matches.
              Arbeitet zusammen und verwandelt fragwürdige Ideen in echte Spielzüge.
          - icon: ""
            title: JEDER COURT VERÄNDERT DAS SPIEL
            body: Jeder Court bringt eigene Twists, Mechaniken und Umgebungen mit, an die sich Teams
              auf unterschiedliche Weise anpassen müssen.
          - icon: ""
            title: PASSE DEINEN CHARAKTER AN
            body: Erstelle deinen Look, baue eine Squad-Identität auf und gib deinem Team einen
              eigenen Stil.
        key_features:
          - icon: ""
            title: Ab auf den Court
            body: >-
              Erlebe First-Person-Basketball, das leicht zugänglich und schwer zu meistern
              ist – für jedes Spielniveau. Lerne, deine Würfe zu timen, den richtigen Pass
              zu wählen und den Ball zu stehlen. Oder stürz dich mit deinen Freunden ins
              Chaos. Aus „Wie ist der denn reingegangen?“ wird „Das war absolut geplant“.


              Starke Teams lassen ihre inneren Bulls raus und lernen, gemeinsam
              anzugreifen und zu verteidigen. (Keine Sorge: Bei den meisten rechnen wir
              eher mit gegenseitigen Sprüchen und allgemeinem Chaos).
          - icon: ""
            title: Die Courts warten
            body: >-
              Vom klassischen Schulhof bis zum Mond: Jeder Court hat eigene
              Besonderheiten. Nutze die Lianen im Dschungel und die geringe Schwerkraft
              auf dem Mond, um dir einen Vorteil zu verschaffen.


              Manche Courts verbergen vielleicht weitere Geheimnisse. Worauf wartet zum
              Beispiel dieser Affe im Dschungel?
          - icon: ""
            title: Freundschaftlicher Wettkampf
            body: >-
              Was wäre eine Runde Basketball ohne freundschaftliche Sticheleien?
              Proximity-Chat, freischaltbare Kosmetik und verschiedene Emotes lassen dich
              vor Gegnern angeben – solange du es auf dem Court auch beweisen kannst.


              Spiele online nach deinen Wünschen: allein oder als Team in Matches bis 3v3.
              Erstelle eine private 5v1-Lobby und finde heraus, wie lange dein Freund Alex
              durchhält! In unserem Discord findest du Mitspieler und eine Community.
        key_features_title: Spielmerkmale
