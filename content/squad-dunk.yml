    pt:
      description:
        heading: O QUE É DUNK?
        short:
          title: DESCRIÇÃO CURTA
          text: Um jogo de basquete em primeira pessoa para 1⁠–⁠6 jogadores em que cada passe,
            bloqueio e DUNK baseado em física depende da sua habilidade. Explore quadras
            únicas pelo universo, converse pelo chat de proximidade ou aperfeiçoe suas
            jogadas no modo solo. Desbloqueie novos visuais, gestos e muito mais para se
            exibir para os amigos!
        long:
          title: DESCRIÇÃO LONGA
          paragraphs:
            - Um jogo de basquete em primeira pessoa para 1⁠–⁠6 jogadores, com partidas de
              1v1 a 3v3. Passe um tempo com os amigos pelo chat de proximidade ou deixe
              suas habilidades falarem enquanto intercepta, derruba, passa e faz DUNK.
        keyFeaturesTitle: Principais recursos
        keyFeatures:
          - icon: ""
            title: JOGUE DE DENTRO DA QUADRA
            body: Controle um jogador em primeira pessoa e viva a partida de dentro da ação, não a
              partir de uma câmera distante.
          - icon: ""
            title: SINTA A FÍSICA
            body: DUNK usa mecânicas baseadas em física para tornar o basquete mais vivo, físico e
              imprevisível. Bloqueios, arremessos, roubadas, rebotes, movimento e contato
              fazem parte de cada momento.
          - icon: ""
            title: JOGUE EM EQUIPE
            body: Jogue sozinho ou com amigos em partidas casuais ou competitivas. Trabalhem juntos e
              transformem ideias questionáveis em jogadas reais.
          - icon: ""
            title: CADA QUADRA MUDA O JOGO
            body: Cada quadra traz seu próprio twist, com mecânicas e ambientes que fazem as equipes
              se adaptarem de formas diferentes.
          - icon: ""
            title: PERSONALIZE SEU PERSONAGEM
            body: Crie seu visual, construa a identidade do seu squad e dê um estilo próprio ao seu
              time.
        key_features:
          - icon: ""
            title: Hora de jogar
            body: >-
              Curta uma experiência de basquete em primeira pessoa fácil de aprender e
              difícil de dominar, para jogadores de todos os níveis. Aprenda a acertar o
              tempo dos arremessos, escolher o passe certo e roubar a bola, ou entre no
              caos e divirta-se com os amigos. Vá de “como isso entrou?” a “era exatamente
              isso que eu queria fazer”.


              Times e jogadores fortes vão despertar seus Bulls interiores e aprender a
              atacar e defender como uma unidade. (Não se preocupe: esperamos que a
              maioria acabe nas provocações e no caos geral).
          - icon: ""
            title: As quadras estão esperando
            body: >-
              Do pátio clássico da escola à Lua, cada quadra tem características próprias
              para dominar. Use os cipós da selva e aproveite a baixa gravidade lunar para
              ganhar vantagem sobre seus adversários.


              Algumas quadras podem esconder outros segredos que merecem ser investigados.
              Afinal, o que aquele macaco está esperando na selva?
          - icon: ""
            title: Competição entre amigos
            body: >-
              Como seria uma partida de basquete sem um pouco de provocação amigável? O
              chat de proximidade, os cosméticos desbloqueáveis e os gestos permitem se
              exibir diante dos adversários, desde que você consiga provar seu valor na
              quadra e fazer seu nome.


              Jogue online do seu jeito, sozinho ou em equipe, com partidas de até 3v3.
              Monte uma sala privada 5v1 e veja quanto tempo seu amigo Alex aguenta! Entre
              no nosso Discord para encontrar jogadores e uma comunidade para jogar junto.
        key_features_title: Recursos
