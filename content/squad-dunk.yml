    en:
      description:
        heading: WHAT IS DUNK?
        short:
          title: SHORT DESCRIPTION
          text: A first-person 1-6 player basketball game where every physics-based pass, block, and
            DUNK comes down to skill. Hit unique courts across the universe, hang out over
            proximity chat, or finesse your 1st-person skills in solo play. Unlock new
            looks, emotes, and more, to flex on your mates!
        long:
          title: LONG DESCRIPTION
          paragraphs:
            - A first-person basketball game for 1-6 players in matches of 1v1 to 3v3.
              Hang out with friends over proximity chat or let your skills do the talking
              as you intercept, tackle, pass, and DUNK.
        key_features_title: Features
        key_features:
          - icon: ""
            title: Balling Out
            body: >-
              Enjoy an easy-to-pick up but hard to master first-person basketball
              experience for players of all skill levels. Learn to time your shots, pick
              the right pass, and steal the ball, or add to the chaos and enjoy simply
              hanging with friends. Grow from asking “how did that go in?” to “I
              absolutely meant for that to happen.”


              Strong teams and players will channel their inner Bulls and learn how to
              work together to defend and attack as a unit. (Don’t worry, we expect most
              of you to fall into name-calling and general chaos).
          - icon: ""
            title: The Courts Are Waiting
            body: >-
              Pull up to courts, from the classic schoolyard to the moon, each with their
              own unique characteristics to master. Use the hanging vines in the jungle
              and make the most of low gravity on the moon to get an edge over your
              opponents.


              Some courts may even hide further secrets worth investigating - like what
              exactly is that monkey waiting for in the jungle?
          - icon: ""
            title: Friendly Competition
            body: >-
              What would a game of pick-up basketball look like without a bit of friendly
              banter? Proximity chat, unlockable cosmetics, and a range of emotes give you
              a way to flex on opponents, so long as you’re prepared to back it up on the
              courts and make a name for yourself.


              Play however you choose online, with matches up to 3v3 available for solo
              players and teams. Set up a private 5v1 lobby and see just how long your
              friend Alex can hold on! Join our Discord to find players and a community to
              play with.
