    fr:
      description:
        heading: QU'EST-CE QUE DUNK ?
        short:
          title: DESCRIPTION COURTE
          text: Un jeu de basket à la première personne pour 1 à 6 joueurs où chaque passe, contre
            et DUNK basé sur la physique dépend de votre talent. Explorez des terrains
            uniques à travers l’univers, discutez via le chat de proximité ou
            perfectionnez votre jeu en solo. Débloquez des apparences, des gestes et bien
            plus pour frimer devant vos amis !
        long:
          title: DESCRIPTION LONGUE
          paragraphs:
            - "Un jeu de basket à la première personne pour 1 à 6 joueurs, dans des matchs
              de 1v1 à 3v3. Retrouvez vos amis via le chat de proximité ou laissez votre
              talent parler : interceptez, bousculez, passez et DUNK."
        keyFeaturesTitle: Points clés
        keyFeatures:
          - icon: ""
            title: JOUEZ DEPUIS LE TERRAIN
            body: Contrôlez un joueur en première personne et vivez le match depuis l'intérieur de
              l'action, pas depuis une caméra éloignée.
          - icon: ""
            title: RESSENTEZ LA PHYSIQUE
            body: DUNK utilise des mécaniques basées sur la physique pour rendre le basket plus
              vivant, plus physique et plus imprévisible. Contres, tirs, interceptions,
              rebonds, mouvements et contacts font partie de chaque moment.
          - icon: ""
            title: JOUEZ EN ÉQUIPE
            body: Jouez en solo ou avec des amis dans des matchs casual ou compétitifs. Coopérez et
              transformez des idées discutables en vraies actions de jeu.
          - icon: ""
            title: CHAQUE TERRAIN CHANGE LE JEU
            body: Chaque terrain ajoute son propre twist, avec des mécaniques et des environnements
              qui obligent les équipes à s'adapter.
          - icon: ""
            title: PERSONNALISEZ VOTRE PERSONNAGE
            body: Créez votre look, construisez l'identité de votre squad et donnez un style propre à
              votre équipe.
        key_features:
          - icon: ""
            title: À vous de jouer
            body: >-
              Profitez d’un basket à la première personne facile à prendre en main et
              difficile à maîtriser, quel que soit votre niveau. Apprenez à choisir le bon
              moment pour tirer, la bonne passe et à voler le ballon, ou semez le chaos
              avec vos amis. Passez de « Comment c’est rentré ? » à « C’était totalement
              calculé ».


              Les meilleures équipes feront ressortir les Bulls qui sommeillent en elles
              et apprendront à attaquer et défendre ensemble. (Pas d’inquiétude : nous
              nous attendons surtout à des noms d’oiseaux amicaux et à un joyeux chaos).
          - icon: ""
            title: Les terrains vous attendent
            body: >-
              De la cour d’école classique à la Lune, chaque terrain possède ses
              particularités. Utilisez les lianes de la jungle et profitez de la faible
              gravité lunaire pour prendre l’avantage.


              Certains terrains cachent peut-être d’autres secrets à découvrir. Qu’attend
              donc ce singe dans la jungle ?
          - icon: ""
            title: Une compétition amicale
            body: >-
              Que serait une partie de basket entre amis sans quelques taquineries ? Le
              chat de proximité, les cosmétiques à débloquer et les gestes vous permettent
              de frimer face à vos adversaires, à condition d’assumer sur le terrain et de
              vous faire un nom.


              Jouez en ligne comme vous voulez, seul ou en équipe, dans des matchs jusqu’à
              3v3. Créez un salon privé 5v1 et voyez combien de temps votre ami Alex tient
              le coup ! Rejoignez notre Discord pour trouver des joueurs et une
              communauté.
        key_features_title: Fonctionnalités
