    ru:
      description:
        heading: ЧТО ТАКОЕ DUNK?
        short:
          title: КРАТКОЕ ОПИСАНИЕ
          text: Баскетбол от первого лица для 1⁠–⁠6 игроков, где каждый физически просчитанный пас,
            блок и DUNK зависит от мастерства. Играйте на необычных площадках по всей
            вселенной, общайтесь в голосовом чате по близости или оттачивайте навыки в
            одиночку. Открывайте новые образы, эмоции и многое другое, чтобы покрасоваться
            перед друзьями!
        long:
          title: ПОДРОБНОЕ ОПИСАНИЕ
          paragraphs:
            - "Баскетбол от первого лица для 1⁠–⁠6 игроков с матчами от 1 на 1 до 3 на 3.
              Общайтесь с друзьями в чате по близости или доказывайте своё мастерство:
              перехватывайте, сбивайте соперников, пасуйте и делайте DUNK."
        keyFeaturesTitle: Ключевые особенности
        keyFeatures:
          - icon: ""
            title: ИГРАЙТЕ С ПЛОЩАДКИ
            body: Управляйте одним игроком от первого лица и переживайте матч изнутри действия, а не с
              далекой камеры.
          - icon: ""
            title: ЧУВСТВУЙТЕ ФИЗИКУ
            body: Физические механики делают баскетбол более живым, контактным и непредсказуемым.
              Блоки, броски, перехваты, подборы, движение и столкновения становятся частью
              каждого момента.
          - icon: ""
            title: ИГРАЙТЕ КОМАНДОЙ
            body: Играйте в одиночку или с друзьями в казуальных и соревновательных матчах. Действуйте
              вместе и превращайте сомнительные идеи в реальные игровые моменты.
          - icon: ""
            title: КАЖДАЯ ПЛОЩАДКА МЕНЯЕТ ИГРУ
            body: "Каждая площадка добавляет собственный поворот: новые механики и окружение
              заставляют команды адаптироваться по-разному."
          - icon: ""
            title: НАСТРОЙТЕ ПЕРСОНАЖА
            body: Создайте свой образ, сформируйте стиль своей команды и дайте ей собственную
              идентичность.
        key_features:
          - icon: ""
            title: Покажите класс
            body: >-
              Баскетбол от первого лица, который легко освоить, но трудно довести до
              совершенства, подойдёт игрокам любого уровня. Выбирайте момент для броска,
              находите верный пас и перехватывайте мяч — или просто устраивайте хаос с
              друзьями. Пройдите путь от «Как это вообще залетело?» до «Именно так я всё и
              задумал».


              Сильные команды раскроют в себе дух Bulls и научатся атаковать и защищаться
              сообща. (Но от большинства мы ожидаем дружеских обзывательств и всеобщего
              хаоса).
          - icon: ""
            title: Площадки ждут
            body: >-
              От школьного двора до Луны — у каждой площадки свои особенности. Используйте
              лианы в джунглях и низкую лунную гравитацию, чтобы получить преимущество над
              соперниками.


              На некоторых площадках могут скрываться и другие секреты. Чего, например,
              ждёт та обезьяна в джунглях?
          - icon: ""
            title: Дружеское соперничество
            body: >-
              Какой уличный баскетбол обходится без дружеских подколов? Чат по близости,
              открываемая косметика и эмоции помогут покрасоваться перед соперниками —
              если вы готовы подтвердить свои слова игрой.


              Играйте онлайн по-своему: приходите в одиночку или командой на матчи до 3 на
              3. Создайте приватную комнату 5 на 1 и проверьте, сколько продержится ваш
              друг Алекс! Присоединяйтесь к нашему Discord, чтобы найти игроков и
              сообщество.
        key_features_title: Особенности
