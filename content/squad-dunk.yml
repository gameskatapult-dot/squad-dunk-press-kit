    es:
      description:
        heading: ¿QUÉ ES DUNK?
        short:
          title: DESCRIPCIÓN CORTA
          text: Un juego de básquetbol en primera persona para 1⁠–⁠6 jugadores donde cada pase,
            bloqueo y DUNK basado en físicas depende de tu habilidad. Recorre canchas
            únicas por el universo, conversa por chat de proximidad o perfecciona tu juego
            en solitario. ¡Desbloquea nuevas apariencias, gestos y mucho más para presumir
            ante tus amigos!
        long:
          title: DESCRIPCIÓN LARGA
          paragraphs:
            - Un juego de básquetbol en primera persona para 1⁠–⁠6 jugadores, con partidas
              de 1v1 a 3v3. Pasa el rato con amigos por chat de proximidad o deja que tu
              habilidad hable mientras interceptas, derribas, pasas y haces DUNK.
        keyFeaturesTitle: Características principales
        keyFeatures:
          - icon: ""
            title: JUEGA DESDE LA CANCHA
            body: Controla a un jugador en primera persona y vive el partido desde dentro de la
              acción, no desde una cámara distante.
          - icon: ""
            title: SIENTE LA FÍSICA
            body: DUNK usa mecánicas basadas en físicas para que el básquetbol se sienta más vivo,
              físico e impredecible. Bloqueos, tiros, robos, rebotes, movimiento y
              contacto forman parte de cada momento.
          - icon: ""
            title: JUEGA EN EQUIPO
            body: Juega solo o con amigos en partidas casuales o competitivas. Coordínense y
              conviertan ideas cuestionables en jugadas reales.
          - icon: ""
            title: CADA CANCHA CAMBIA EL JUEGO
            body: Cada cancha suma su propio giro, con mecánicas y entornos que obligan a los equipos
              a adaptarse de distintas maneras.
          - icon: ""
            title: PERSONALIZA TU PERSONAJE
            body: Crea tu apariencia, construye la identidad de tu squad y dale un estilo propio a tu
              equipo.
        key_features:
          - icon: ""
            title: A jugar
            body: >-
              Disfruta una experiencia de básquetbol en primera persona fácil de aprender
              y difícil de dominar, para jugadores de todos los niveles. Aprende a
              calcular tus tiros, elegir el pase correcto y robar la pelota, o súmate al
              caos y disfruta pasando el rato con amigos. Pasa de preguntar «¿cómo entró
              eso?» a «lo hice totalmente a propósito».


              Los equipos y jugadores más fuertes sacarán a relucir sus Bulls interiores y
              aprenderán a defender y atacar como una unidad. (No te preocupes: esperamos
              que la mayoría termine entre insultos amistosos y caos general).
          - icon: ""
            title: Las canchas te esperan
            body: >-
              Desde el clásico patio de colegio hasta la luna, cada cancha tiene
              características únicas que dominar. Usa las lianas de la jungla y aprovecha
              la baja gravedad en la luna para sacar ventaja a tus rivales.


              Algunas canchas incluso podrían esconder secretos que vale la pena
              investigar: ¿qué estará esperando ese mono en la jungla?
          - icon: ""
            title: Competencia entre amigos
            body: >-
              ¿Qué sería de una partida de básquetbol sin un poco de bromas entre amigos?
              El chat de proximidad, los cosméticos desbloqueables y los gestos te
              permiten presumir ante tus rivales, siempre que puedas respaldarlo en la
              cancha y hacerte un nombre.


              Juega online a tu manera, con partidas de hasta 3v3 para quienes se conectan
              solos o en equipo. ¡Arma una sala privada 5v1 y descubre cuánto aguanta tu
              amigo Alex! Únete a nuestro Discord para encontrar jugadores y una comunidad
              con la que jugar.
        key_features_title: Características
