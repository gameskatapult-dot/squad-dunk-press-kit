    zh:
      description:
        heading: DUNK 是什么？
        short:
          title: 简短介绍
          text: 一款支持1⁠–⁠6人的第一人称篮球游戏，每一次基于物理的传球、盖帽和DUNK都取决于你的技巧。踏上遍布宇宙的独特球场，用近距离聊天和朋友闲聊，或通过单人游玩磨练第一人称球技。解锁新造型、表情等内容，在朋友面前秀一把！
        long:
          title: 详细介绍
          paragraphs:
            - 支持1⁠–⁠6人的第一人称篮球游戏，比赛规模从1v1到3v3。通过近距离聊天和朋友相聚，或者用拦截、冲撞、传球和DUNK展现实力。
        keyFeaturesTitle: 核心特色
        keyFeatures:
          - icon: ""
            title: 从球场内部开始比赛
            body: 以第一人称控制一名球员，从球场内部体验传球、抢断、投篮和防守，而不是从远处俯视比赛。
          - icon: ""
            title: 感受物理互动
            body: DUNK 使用基于物理的机制，让篮球更鲜活、更有身体感，也更不可预测。盖帽、投篮、抢断、篮板、移动和碰撞都会成为比赛的一部分。
          - icon: ""
            title: 团队配合
            body: 你可以单人游玩，也可以和朋友一起进行休闲或竞技比赛。协作配合，把看似离谱的想法变成真实可行的战术。
          - icon: ""
            title: 每个球场都会改变比赛
            body: 每个球场都有自己的变化、机制和环境，迫使队伍用不同方式适应局势。
          - icon: ""
            title: 自定义你的角色
            body: 打造自己的外观，建立队伍身份，让你的队伍拥有独特风格。
        key_features:
          - icon: ""
            title: 尽情打球
            body: |-
              享受易于上手、难于精通的第一人称篮球，适合各种水平的玩家。学习掌握投篮时机、选择合适的传球和抢断，或者加入混乱，单纯享受与朋友相处的时光。从“这都能进？”成长到“完全在我计划之中”。

              强大的球队和球员会唤醒内心的公牛队之魂，学会团结一致地进攻和防守。（别担心，我们预计大多数人最终都会沉迷于互相调侃和一片混乱）。
          - icon: ""
            title: 球场在等你
            body: |-
              从经典校园球场到月球，每块场地都有独特的特点等你掌握。利用丛林里的藤蔓和月球的低重力，在对手面前取得优势。

              有些球场或许还藏着值得探索的秘密——比如，丛林里那只猴子到底在等什么？
          - icon: ""
            title: 友谊与竞争
            body: |-
              没有几句朋友间的玩笑，还算什么街头篮球？近距离聊天、可解锁的外观和各种表情，让你能向对手炫耀，只要你准备好在球场上用实力证明自己。

              在线游玩随你选择，单独加入或组队都能参加最高3v3的比赛。创建5v1私人大厅，看看朋友Alex能撑多久！加入我们的Discord，寻找玩家和一起游玩的伙伴。
        key_features_title: 游戏特色
