    ja:
      description:
        heading: DUNKとは？
        short:
          title: ショート説明
          text: 1～6人で遊ぶ一人称視点のバスケットボール。物理演算に基づくパス、ブロック、DUNKのすべてが腕次第。宇宙各地の個性的なコートを巡り、近接チャットで交流したり、ソロプレイで技を磨いたり。新しい見た目やエモートなどをアンロックして、友達に自慢しよう！
        long:
          title: ロング説明
          paragraphs:
            - 1～6人向けの一人称視点バスケットボール。1対1から3対3までの試合を楽しめます。近接チャットで友達と過ごすもよし、インターセプト、タックル、パス、DUNKで腕前を見せるもよし。
        keyFeaturesTitle: 主な特徴
        keyFeatures:
          - icon: ""
            title: コートの中からプレイ
            body: 遠くのカメラではなく、一人称視点で1人の選手を操作し、アクションの内側から試合を体験します。
          - icon: ""
            title: 物理を感じる
            body: 物理ベースのメカニクスにより、ブロック、シュート、スティール、リバウンド、移動、接触のすべてが、その瞬間のプレイに影響します。
          - icon: ""
            title: チームでプレイ
            body: ソロでも友達とでも、カジュアルまたは競技的な試合を遊べます。チームを組み、普通のバスケットボールなら反則になりそうなアイデアを本物のプレイに変えましょう。
          - icon: ""
            title: コートごとにゲームが変わる
            body: それぞれのコートには独自の仕掛け、メカニクス、環境があり、チームは状況に合わせてプレイを変える必要があります。
          - icon: ""
            title: キャラクターをカスタマイズ
            body: 自分の見た目を作り、スクワッドの個性を築き、チーム独自のスタイルを与えましょう。
        key_features:
          - icon: ""
            title: コートで魅せよう
            body: |-
              始めやすく、極めがいのある一人称視点バスケットボール。どんな腕前でも楽しめます。シュートのタイミング、パスの選択、スティールを学ぶもよし、友達と騒いで過ごすもよし。「どうして入ったの？」から「完全に狙い通り」へ成長しよう。

              強いチームは内なるブルズ魂を発揮し、一丸となって攻め、守ることを学びます。（もちろん、大半の皆さんは軽口と大騒ぎに夢中になるはずです）。
          - icon: ""
            title: コートが待っている
            body: |-
              おなじみの校庭から月まで、コートにはそれぞれ独自の特徴があります。ジャングルのつるや月の低重力を使いこなして、相手より優位に立とう。

              コートには、調べる価値のある秘密が隠れているかもしれません。ジャングルにいるあのサルは、一体何を待っているのでしょう？
          - icon: ""
            title: 仲間との競い合い
            body: |-
              気軽なバスケに、ちょっとした軽口はつきもの。近接チャット、アンロックできるコスメ、多彩なエモートで相手にアピールしよう。ただし、コートでも実力を証明することを忘れずに。

              オンラインでは、ソロ参加でもチームでも最大3対3で遊べます。5対1のプライベートロビーを作って、友達のアレックスがどこまで耐えられるか試そう！プレイヤーや仲間を探すなら、Discordに参加してください。
        key_features_title: 特徴
