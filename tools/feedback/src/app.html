<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DUNK Feedback</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface: #fcfcfb; --surface-2: #f0efec; --line: #e3e1db; --line-strong: #cfcdc5;
  --text: #1b1b1a; --text-2: #52514e; --muted: #7b7a74;
  --accent: #e2602b; --accent-ink: #fff; --accent-soft: #fdeee6;
  --grid: #ebe9e3;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --st-new: #2a78d6; --st-reviewed: #6250d6; --st-planned: #eda100; --st-in_progress: #eb6834; --st-fixed: #1baf7a; --st-wontfix: #9a9890;
  --seq-0: #f0efec; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95;
  --shadow: 0 1px 2px rgba(20, 20, 18, .05), 0 4px 16px rgba(20, 20, 18, .04);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #2c2c2a; --line-strong: #3b3b38;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e87;
    --accent: #eb6834; --accent-ink: #1a0d02; --accent-soft: #2e1a10;
    --grid: #262624;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --st-new: #3987e5; --st-reviewed: #9085e9; --st-planned: #c98500; --st-in_progress: #d95926; --st-fixed: #199e70; --st-wontfix: #6f6e68;
    --seq-0: #232321; --seq-1: #0d366b; --seq-2: #104281; --seq-3: #184f95; --seq-4: #256abf; --seq-5: #3987e5; --seq-6: #6da7ec;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #2c2c2a; --line-strong: #3b3b38;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e87;
  --accent: #eb6834; --accent-ink: #1a0d02; --accent-soft: #2e1a10;
  --grid: #262624;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --st-new: #3987e5; --st-reviewed: #9085e9; --st-planned: #c98500; --st-in_progress: #d95926; --st-fixed: #199e70; --st-wontfix: #6f6e68;
  --seq-0: #232321; --seq-1: #0d366b; --seq-2: #104281; --seq-3: #184f95; --seq-4: #256abf; --seq-5: #3987e5; --seq-6: #6da7ec;
  --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--s1); }
h1, h2, h3 { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Header */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 14px; padding: 10px 20px; max-width: 1400px; margin: 0 auto; }
.brand { font-weight: 800; font-size: 16px; letter-spacing: .2px; white-space: nowrap; }
.brand b { color: var(--accent); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 8px; color: var(--text-2); font-weight: 500; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.spacer { flex: 1; }
.synced { font-size: 12px; color: var(--muted); white-space: nowrap; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
.icon-btn:hover { border-color: var(--line-strong); color: var(--text); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); object-fit: cover; }
.signout { font-size: 12px; color: var(--muted); text-decoration: none; }

/* Simple mode */
.page { max-width: 1120px; margin: 0 auto; padding: 24px 20px 64px; }
.hello { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
.hello h1 { font-size: 24px; font-weight: 700; }
.hello p { margin: 4px 0 0; color: var(--text-2); }
.select { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .label { font-size: 13px; color: var(--text-2); }
.tile .value { font-size: 30px; font-weight: 700; line-height: 1.15; letter-spacing: -.5px; }
.tile .value.text { font-size: 16px; line-height: 1.35; letter-spacing: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .sub { font-size: 12px; color: var(--muted); }
.tile .go { margin-top: auto; padding-top: 8px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; margin-bottom: 12px; }
.cards .card { margin-bottom: 0; }
.card.full { grid-column: 1 / -1; }
.card-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { font-size: 15px; font-weight: 650; }
.card-h .spacer { flex: 1; }
.list-simple { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; align-items: center; }
.li:first-child { border-top: 0; padding-top: 2px; }
.li:hover .li-t { color: var(--accent); }
.li-t { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-s { font-size: 13px; color: var(--muted); margin-top: 2px; }
.quote { color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; }
.likes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.like { margin: 0; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.like:hover { outline: 1px solid var(--line-strong); }
.like blockquote { margin: 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.like figcaption { font-size: 12px; color: var(--muted); margin-top: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; background: var(--surface-2); border-radius: 999px; padding: 2px 10px; color: var(--text-2); border: 0; }
button.chip:hover { color: var(--text); }
.trend-up { color: var(--accent); font-weight: 600; }
.count { font-weight: 700; font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 2px 9px; border-radius: 999px; white-space: nowrap; }

/* Charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.axis text { fill: var(--muted); font-size: 11px; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--line-strong); stroke-width: 1; }
.hbar { display: grid; grid-template-columns: 110px minmax(0, 1fr) 40px; gap: 10px; align-items: center; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
.hbar:hover { background: var(--surface-2); }
.hbar .name { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .track { height: 14px; position: relative; }
.hbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
.hbar .num { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
.stackbar { display: flex; height: 18px; gap: 2px; border-radius: 4px; overflow: hidden; margin: 6px 0 12px; }
.stackbar div { min-width: 3px; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i, .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.legend b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); opacity: 0; transition: opacity .1s; min-width: 120px; }
.tip.show { opacity: 1; }
.tip .tt { font-weight: 650; margin-bottom: 4px; }
.tip .tr { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.tip .tr span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
.heat { border-collapse: separate; border-spacing: 2px; width: 100%; font-size: 12px; table-layout: fixed; min-width: 640px; }
.heat th:first-child, .heat td.rowh:first-child { width: 96px; }
.heat th { color: var(--muted); font-weight: 500; text-align: center; padding: 4px; white-space: nowrap; }
.heat th:first-child { text-align: left; }
.heat td { text-align: center; padding: 8px 4px; border-radius: 4px; font-variant-numeric: tabular-nums; cursor: pointer; }
.heat td.rowh { text-align: left; font-weight: 600; background: none; cursor: default; white-space: nowrap; }
.heat td.dark { color: #fff; }
.scroll-x { overflow-x: auto; }
.view-table summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-top: 10px; }
.view-table table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
.view-table td, .view-table th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; }

/* Advanced mode */
.adv { max-width: 1400px; margin: 0 auto; }
.subnav { display: flex; gap: 4px; padding: 12px 20px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.subnav button { border: 0; background: none; padding: 8px 12px 10px; color: var(--text-2); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.subnav button.on { color: var(--text); border-bottom-color: var(--accent); }
.subnav .n { font-size: 12px; color: var(--muted); margin-left: 4px; background: var(--surface-2); padding: 1px 7px; border-radius: 999px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; align-items: center; border-bottom: 1px solid var(--line); }
.search { flex: 1 1 240px; min-width: 180px; position: relative; }
.search input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px 7px 32px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.clear { font-size: 13px; }
.work { display: grid; grid-template-columns: minmax(320px, 0.9fr) minmax(0, 1.1fr); height: calc(100vh - 190px); min-height: 420px; }
.list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); }
.row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: start; }
.row:hover { background: var(--surface-2); }
.row.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.row input { margin-top: 3px; }
.row .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .p { color: var(--text-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.row .m { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.row .r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); background: var(--surface-2); padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.src { display: inline-flex; align-items: center; gap: 5px; }
.suggested { font-style: italic; }
.detail { overflow-y: auto; padding: 22px 28px 80px; }
.detail .crumbs { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.detail h2 { font-size: 21px; line-height: 1.35; margin-bottom: 14px; }
.content { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.content .q { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 12px; }
.content .q:first-child { margin-top: 0; }
.content .a { white-space: pre-wrap; word-break: break-word; font-size: 16px; line-height: 1.6; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 14px; }
.box h3 { font-size: 13px; font-weight: 650; margin-bottom: 10px; }
.statuses { display: flex; flex-wrap: wrap; gap: 6px; }
.sbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 11px; display: inline-flex; gap: 7px; align-items: center; color: var(--text-2); }
.sbtn:hover { border-color: var(--line-strong); }
.sbtn.on { color: var(--text); font-weight: 600; border-color: var(--text-2); background: var(--surface-2); }
.sbtn kbd { font: 10px ui-monospace, monospace; color: var(--muted); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.f label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.f select, .f input, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; }
textarea { min-height: 76px; resize: vertical; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 5px 8px; }
.tags input { border: 0; background: none; outline: none; flex: 1; min-width: 120px; padding: 2px; }
.tag { background: var(--surface-2); border-radius: 6px; padding: 1px 4px 1px 8px; font-size: 12px; display: inline-flex; align-items: center; }
.tag button { background: none; border: 0; color: var(--muted); padding: 0 4px; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.imgs img { max-width: 220px; max-height: 160px; border-radius: 8px; border: 1px solid var(--line); }
.sim { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; margin-top: 6px; }
.sim .x { flex: 1; min-width: 0; cursor: pointer; }
.sim .x div:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 5px 10px; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.comment { padding: 8px 0; border-top: 1px solid var(--line); }
.comment:first-of-type { border-top: 0; }
.comment .c { white-space: pre-wrap; word-break: break-word; }
.hist { font-size: 12px; color: var(--muted); padding: 2px 0; }
.empty { color: var(--muted); padding: 48px 20px; text-align: center; }
.empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.chat-list { display: flex; flex-direction: column; gap: 2px; max-height: 360px; overflow-y: auto; margin: -2px -4px 10px; padding: 0 4px; }
.msg { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 6px 0; }
.msg.cont { padding-top: 0; }
.msg .av { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--text-2); overflow: hidden; }
.msg .av img { width: 100%; height: 100%; object-fit: cover; }
.msg.cont .av { visibility: hidden; height: 0; }
.msg .who { font-size: 13px; font-weight: 650; display: flex; gap: 8px; align-items: baseline; }
.msg .who span { font-weight: 400; font-size: 12px; color: var(--muted); }
.msg .body { white-space: pre-wrap; word-break: break-word; }
.msg .del { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 0; margin-left: auto; opacity: 0; }
.msg:hover .del, .msg .del:focus { opacity: 1; }
.chat-form { display: flex; gap: 8px; align-items: flex-end; }
.chat-form textarea { min-height: 42px; max-height: 160px; resize: none; flex: 1; }
.chat-empty { color: var(--muted); font-size: 13px; padding: 2px 0 10px; }
.talk { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.talk.unread { color: var(--accent); font-weight: 650; }
.dl { display: inline-flex; align-items: center; gap: 6px; }
.kbd-hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
.kbd-hint kbd { font: 11px ui-monospace, monospace; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.back { display: none; margin-bottom: 12px; }
.bulk { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; padding: 8px 10px 8px 14px; display: none; gap: 8px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.2); z-index: 30; max-width: calc(100vw - 32px); flex-wrap: wrap; }
.bulk.show { display: flex; }
.wide { padding: 20px; }
.rank { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; cursor: pointer; align-items: center; }
.rank:hover { border-color: var(--line-strong); }
.rank .big { font-size: 24px; font-weight: 750; color: var(--accent); text-align: center; line-height: 1; }
.rank .big small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 4px; }
.toast { position: fixed; bottom: 18px; right: 18px; background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 10px; opacity: 0; transform: translateY(6px); transition: all .2s; z-index: 60; font-size: 13px; }
.toast.show { opacity: 1; transform: none; }

/* Calmer layout: hero, welcome, collapsible sections */
.topbar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 26px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; margin-bottom: 16px; }
.hero h1 { font-size: 26px; font-weight: 750; letter-spacing: -.3px; line-height: 1.2; }
.hero p { margin: 6px 0 0; color: var(--text-2); font-size: 15px; }
.btn-lg { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 11px; padding: 12px 20px; font-weight: 650; font-size: 15px; white-space: nowrap; }
.btn-lg:hover { filter: brightness(1.05); }
.btn-lg.ghost { background: var(--surface-2); color: var(--text); }
.welcome { display: flex; gap: 16px; align-items: flex-start; background: var(--accent-soft); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; }
.welcome ol { margin: 6px 0 0; padding-left: 20px; color: var(--text-2); }
.welcome li { margin: 3px 0; }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile[data-go] { cursor: pointer; }
.tile[data-go]:hover { border-color: var(--line-strong); }
.cards { align-items: start; }
.row input[type=checkbox] { opacity: 0; transition: opacity .1s; }
.row:hover input[type=checkbox], .row input[type=checkbox]:checked, .row input[type=checkbox]:focus-visible, .list.picking .row input[type=checkbox] { opacity: 1; }
.likes.one { grid-template-columns: 1fr; }
details.more { margin-top: 16px; }
details.more > summary, details.sec > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; user-select: none; }
details.more > summary::-webkit-details-marker, details.sec > summary::-webkit-details-marker { display: none; }
details.more > summary { font-weight: 600; color: var(--text-2); padding: 10px 2px; }

<script>
// ---------- Constants ----------

// ---------- State ----------

const TALK_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>';
const DL_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>';

  mode: 'simple', tab: 'inbox', q: '', src: '', status: '', cat: '', build: '', sys: '', sort: 'new', dups: false,
  sel: null, checked: new Set(), sBuild: '', iBuild: '', iSrc: '',

// ---------- Helpers ----------
const $ = (s, r = document) => r.querySelector(s);

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }
async function call(path, opts = {}) {

const real = (list) => list.filter((i) => !isSpam(i));

function headline(it) {

const builds = () => [...new Set(items.map(buildOf))].sort(cmpBuild).reverse();

const srcDot = (s) => `<span class="src"><i class="dot" style="background:${SRC_COLOR[s]}"></i>${SRC[s] || esc(s)}</span>`;
const statusPill = (s) => `<span class="pill"><i class="dot" style="background:var(--st-${s})"></i>${STATUS[s]}</span>`;

// ---------- Similar feedback ----------
const STOP = new Set('the a an and or but to of in on for is it i you we they that this be was are with as at by from my me so if not do does dont can cant would could should have has had more just like when what there their them its im ive game play playing players player really very also get got make maybe some any one all be please'.split(' '));
const tokCache = new Map();
function tokens(it) {

  const out = [];
  for (const b of items) {

// ---------- Tooltip ----------
const tip = $('#tip');

const hideTip = () => tip.classList.remove('show');

// ---------- Charts ----------
function niceScale(v) { const raw = Math.max(1, v) / 4; const p = Math.pow(10, Math.floor(Math.log10(raw))); const m = raw / p; const step = Math.max(1, (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p); return { step, max: Math.ceil(Math.max(1, v) / step) * step }; }
function topRounded(x, y, w, h, r) {

  if (h <= 0) return '';
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;

// Columns per day. series: [{key,label,color}] ; days: [{key, values:{seriesKey:n}}]
function columnChart(el, days, series, { height = 200, onPick } = {}) {
  const W = Math.max(280, el.clientWidth || 600), H = height, L = 30, R = 6, T = 8, B = 24;
  const totals = days.map((d) => series.reduce((s, x) => s + (d.values[x.key] || 0), 0));
  const { step: tick, max } = niceScale(Math.max(1, ...totals));
  const iw = W - L - R, ih = H - T - B, step = iw / days.length, bw = Math.max(2, Math.min(18, step - 2));

// ---------- Filtering ----------

// ---------- Simple mode ----------
function renderSimple() {

  const cats = Object.keys(CAT).map((k) => ({ key: k, label: CAT[k], value: canon.filter((i) => catOf(i) === k && now - new Date(i.created_at) < 30 * DAY).length }))

    state.tab = it && it.status === 'new' && !it.duplicate_of ? 'inbox' : 'all';
    Object.assign(state, { q: '', src: '', status: '', cat: '', build: '', sys: '', dups: !!it?.duplicate_of });

// ---------- Team chat ----------
let chatFor = null, chatDraft = '', chatLast = 0;
function initials(name) { return String(name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase(); }
function chatHtml(msgs) {
  if (!msgs.length) return '<div class="chat-empty">No comments yet. Start the conversation: what do you think about this one?</div>';
  return msgs.map((m, i) => msgHtml(m, msgs[i - 1])).join('');
}
function msgHtml(m, prev) {
  const cont = prev && prev.user_id === m.user_id && new Date(m.created_at) - new Date(prev.created_at) < 5 * 60000;
  const mine = me && m.user_id === me.id;
  const when = new Date(m.created_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  return `<div class="msg ${cont ? 'cont' : ''}" data-msg="${m.id}" data-user="${esc(m.user_id)}" data-at="${esc(m.created_at)}">
    <div class="av">${m.avatar ? `<img src="${esc(m.avatar)}" alt="">` : esc(initials(m.user_name))}</div>
    <div style="min-width:0">${cont ? '' : `<div class="who">${esc(m.user_name)}<span title="${esc(when)}">${ago(m.created_at)}</span>${mine ? `<button class="del" data-delmsg="${m.id}">Delete</button>` : ''}</div>`}
      <div class="body">${esc(m.body)}</div>${cont && mine ? `<button class="del" data-delmsg="${m.id}">Delete</button>` : ''}</div></div>`;
}
function scrollChat() { const l = $('#chatList'); if (l) l.scrollTop = l.scrollHeight; }
function autoGrow(t) { t.style.height = 'auto'; t.style.height = Math.min(160, t.scrollHeight + 2) + 'px'; }
function appendMsgs(msgs) {
  const list = $('#chatList'); if (!list || !msgs.length) return;
  if (list.querySelector('.chat-empty')) list.innerHTML = '';
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  for (const m of msgs) {
    if (list.querySelector(`[data-msg="${m.id}"]`)) continue;
    const last = list.querySelector('.msg:last-child');
    const prev = last ? { user_id: last.dataset.user, created_at: last.dataset.at } : null;
    list.insertAdjacentHTML('beforeend', msgHtml(m, prev));
    chatLast = Math.max(chatLast, m.id);
  }
  const it = byId.get(chatFor);
  if (it) { it.team_count = list.querySelectorAll('.msg').length; it.team_last = msgs[msgs.length - 1].created_at; markSeen(it); updateRowTalk(it); }
  if (atBottom) scrollChat();
}
function updateRowTalk(it) {
  const row = document.querySelector(`.row[data-id="${it.id}"]`); if (!row) return;
  const html = rowHtml(it); const tmp = document.createElement('div'); tmp.innerHTML = html;
  row.replaceWith(tmp.firstElementChild);
}
async function sendChat() {
  const ci = $('#chatIn'); const id = chatFor; if (!ci || !id) return;
  const body = ci.value.trim(); if (!body) return;
  ci.value = ''; chatDraft = ''; autoGrow(ci);
  try { const m = await call(`/api/items/${id}/chat`, { method: 'POST', body: JSON.stringify({ body }) }); if (chatFor === id) { appendMsgs([m]); scrollChat(); } }
  catch (e) { ci.value = body; chatDraft = body; toast("Couldn't send: " + e.message); }
}
async function pollChat() {
  if (document.hidden || !chatFor || !$('#chatList')) return;
  const id = chatFor;
  try { const msgs = await call(`/api/items/${id}/chat?after=${chatLast}`); if (chatFor === id && msgs.length) appendMsgs(msgs); } catch {}
}
setInterval(pollChat, 8000);
async function loadDiscussions() {
  try {
    const rows = await call('/api/discussions');

    el.innerHTML = rows.slice(0, 4).map((m) => { const it = byId.get(m.item_id); return `<div class="li" data-open="${m.item_id}"><div style="min-width:0"><div class="li-t">${esc(it ? headline(it) : 'Feedback')}</div><div class="li-s"><b style="color:var(--text-2)">${esc(m.user_name)}:</b> ${esc(m.body.slice(0, 120))} · ${ago(m.created_at)}</div></div>${it && unread(it) ? '<span class="talk unread">new</span>' : ''}</div>`; }).join('')

// ---------- Spreadsheet export ----------
function plainFeedback(it) {
  if (it.fields?.length) return it.fields.filter((f) => f.a !== it.liked).map((f) => (/^feedback$/i.test(f.q.trim()) ? f.a : `${shortQ(f.q)}: ${f.a}`)).join('\n');
  return [it.title, it.content].filter(Boolean).join('\n');
}
function shortQ(q) {
  if (/enjoy|like/i.test(q)) return 'Liked';
  if (/frustrat|confus/i.test(q)) return 'Frustrating';
  if (/add|one thing|would add/i.test(q)) return 'Would add';
  return q.replace(/[?:]+$/, '');
}
function exportCsv(list, label) {
  const cols = ['Date', 'Version', 'Source', 'Moment', 'Topic', 'Game systems', 'Status', 'Priority', 'People asking', 'Reactions', 'Feedback', 'What they liked', 'Team notes', 'Team comments', 'Link'];
  const cell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = list.map((it) => [
    new Date(it.created_at).toISOString().slice(0, 10), it.build || '', SRC[it.source] || it.source, it.context || '',
    CAT_ONE[catOf(it)], (it.systems || []).map((x) => SYS[x] || x).join(', '), STATUS[it.status], PRIO[it.priority] || '',
    asked(it), it.reactions || 0, plainFeedback(it), it.liked || '', it.notes || '', it.team_count || 0, it.url || '',
  ].map(cell).join(','));
  const csv = '\uFEFF' + [cols.join(','), ...rows].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `dunk-feedback-${label}-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`Downloaded ${list.length} rows. In Google Sheets: File → Import → Upload.`);
}

// ---------- Saving ----------
async function patch(id, changes, msg) {
  const it = byId.get(id); const before = { ...it };
  Object.assign(it, changes);
  if ('duplicate_of' in changes) {
    if (changes.duplicate_of) { const t = byId.get(changes.duplicate_of); it.duplicate_of = t?.duplicate_of || changes.duplicate_of; items.forEach((x) => { if (x.duplicate_of === id) x.duplicate_of = it.duplicate_of; }); }
    rebuild();
  }
  try { await call(`/api/items/${id}`, { method: 'PATCH', body: JSON.stringify(changes) }); if (msg) toast(msg); }
  catch (e) { Object.assign(it, before); rebuild(); toast("Couldn't save: " + e.message); }
}
// Spam: se esconde y en la bandeja pasa al siguiente.
async function markSpam(id) {
  const idx = current.findIndex((i) => i.id === id);
  await patch(id, { category: 'spam' }, 'Hidden as spam');
  const next = current[idx + 1] || current[idx - 1];
  state.sel = next && next.id !== id ? next.id : null;
  refresh(state.sel);
}
function refresh(id) {
  const sc = $('#list')?.scrollTop;
  render();
  if ($('#list')) $('#list').scrollTop = sc;
  if (id && byId.has(id) && $('#detail')) openItem(id, { keep: true });
}

    if (k === 'bugs') goAdvanced('all', { cat: 'bug', build: state.sBuild });
    if (k === 'liked') goAdvanced('liked', { build: state.sBuild });

  if (t.matches('[data-check]')) { e.stopPropagation(); t.checked ? state.checked.add(t.dataset.check) : state.checked.delete(t.dataset.check); renderBulk(); return; }

  const row = t.closest('.row'); if (row) { openItem(row.dataset.id); return; }

    catch (err) { toast("Couldn't delete: " + err.message); }
    return;
  }
  if (t.id === 'dismissWelcome') { state.welcomed = true; render(); return; }
  if (t.closest('#fToggle')) { state.fOpen = !state.fOpen; render(); return; }
  const unf = t.closest('[data-unf]'); if (unf) { state[unf.dataset.unf] = unf.dataset.unf === 'dups' ? false : ''; render(); return; }
  if (t.id === 'clearF') { Object.assign(state, { q: '', src: '', status: '', cat: '', build: '', sys: '', dups: false }); render(); return; }
  const id = state.sel;
  const sb = t.closest('[data-status]');
  if (sb && id) { await patch(id, { status: sb.dataset.status }, `Marked as ${STATUS[sb.dataset.status]}`); refresh(id); return; }
  const un = t.closest('[data-untag]'); if (un && id) { const it = byId.get(id); await patch(id, { tags: (it.tags || []).filter((x) => x !== un.dataset.untag) }); refresh(id); return; }
  const mi = t.closest('[data-mergeinto]'); if (mi && id) { await patch(id, { duplicate_of: mi.dataset.mergeinto }, 'Merged as duplicate'); refresh(id); return; }
  if (t.closest('[data-spam]') && id) { await markSpam(id); return; }
  if (t.closest('[data-notspam]') && id) { await patch(id, { not_spam: true }, 'Moved out of spam'); await load(); return; }
  if (t.closest('[data-undup]') && id) { await patch(id, { duplicate_of: null }, 'Unmerged'); refresh(id); return; }
  const uo = t.closest('[data-undupother]'); if (uo) { await patch(uo.dataset.undupother, { duplicate_of: null }, 'Split out'); refresh(id); return; }
  const sync = t.closest('#syncBtn');
  if (sync) {
    sync.disabled = true; sync.querySelector('span').textContent = 'Checking…';
    try { await call('/api/sync', { method: 'POST', body: '{}' }); await load(); toast('Up to date'); }
    catch (err) { toast('Error: ' + err.message); }
    sync.disabled = false; sync.querySelector('span').textContent = 'Refresh';
    return;
  }
  if (t.id === 'bulkClear') { state.checked.clear(); render(); return; }
  if (t.id === 'bulkDup') {
    const ids = current.filter((i) => state.checked.has(i.id)).map((i) => i.id);
    if (ids.length < 2) return toast('Select at least two');
    const [main, ...rest] = ids;
    for (const r of rest) await patch(r, { duplicate_of: main });
    toast(`Merged ${rest.length} into the first one`); state.checked.clear(); state.sel = main; refresh(main); return;
  }
});

document.addEventListener('change', async (e) => {
  const t = e.target, id = state.sel;
  const set = (k, v) => { state[k] = v; render(); };
  if (t.id === 'sBuild') return set('sBuild', t.value);
  if (t.id === 'iBuild') return set('iBuild', t.value);
  if (t.id === 'iSrc') return set('iSrc', t.value);
  if (t.id === 'fSrc') return set('src', t.value);
  if (t.id === 'fStatus') return set('status', t.value);
  if (t.id === 'fCat') return set('cat', t.value);
  if (t.id === 'fBuild') return set('build', t.value);
  if (t.id === 'fSys') return set('sys', t.value);
  if (t.id === 'fSort') return set('sort', t.value);
  if (t.id === 'fDups') return set('dups', t.checked);
  if (t.id === 'dCat' && id) { await patch(id, { category: t.value || null }, 'Topic saved'); refresh(id); return; }
  if (t.id === 'dPrio' && id) { await patch(id, { priority: t.value ? Number(t.value) : null }, 'Priority saved'); refresh(id); return; }
  if (t.id === 'dNotes' && id) { await patch(id, { notes: t.value }, 'Notes saved'); return; }
  if ((t.id === 'bulkStatus' || t.id === 'bulkCat') && t.value) {
    const changes = t.id === 'bulkStatus' ? { status: t.value } : { category: t.value };
    const ids = [...state.checked];
    try { await call('/api/bulk', { method: 'POST', body: JSON.stringify({ ids, changes }) }); ids.forEach((i) => Object.assign(byId.get(i), changes)); toast(`Updated ${ids.length}`); }
    catch (err) { toast('Error: ' + err.message); }
    state.checked.clear(); render();
  }
});

document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (d.id === 'moreCharts') { state.moreOpen = d.open; persist(); if (d.open) drawDays(); return; }
  if (d.matches?.('details[data-sec]')) { state.open[d.dataset.sec] = d.open; persist(); }
}, true);
document.addEventListener('submit', (e) => { if (e.target.id === 'chatForm') { e.preventDefault(); sendChat(); } });
let qTimer;
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { state.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }, 200);
  }
  if (e.target.id === 'chatIn') { autoGrow(e.target); chatDraft = e.target.value; }
  if (e.target.id === 'dupSearch') {
    const q = e.target.value.trim().toLowerCase();
    const res = q.length < 2 ? [] : items.filter((x) => x.id !== state.sel && !x.duplicate_of && `${x.title || ''} ${x.content}`.toLowerCase().includes(q)).slice(0, 6);
    $('#dupResults').innerHTML = res.map((x) => `<div class="sim"><div class="x" data-open="${x.id}"><div>${esc(headline(x))}</div><div class="small muted">${SRC[x.source]} · ${ago(x.created_at)}</div></div><button class="btn" data-mergeinto="${x.id}">Same thing</button></div>`).join('');
  }
});

document.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(e, `<div>${el.dataset.tip}</div>`); });
document.addEventListener('mousemove', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTip(e, `<div>${el.dataset.tip}</div>`); });
document.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tip]') && !e.relatedTarget?.closest?.('[data-tip]')) hideTip(); });

document.addEventListener('keydown', async (e) => {
  if (e.target.id === 'tagIn' && e.key === 'Enter' && e.target.value.trim()) {
    const id = state.sel, it = byId.get(id);
    await patch(id, { tags: [...(it.tags || []), e.target.value.trim().toLowerCase()] });
    refresh(id); setTimeout(() => $('#tagIn')?.focus(), 30); return;
  }
  if (e.target.id === 'chatIn' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); return; }
  if (e.target.id === 'chatIn' && e.key === 'Escape') { e.target.blur(); return; }
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (state.mode !== 'advanced') return;
  if (e.key === '/') { e.preventDefault(); $('#q')?.focus(); return; }
  if (!$('#list')) return;
  const idx = current.findIndex((i) => i.id === state.sel);
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); const n = current[Math.min(current.length - 1, idx + 1)]; if (n) openItem(n.id); }
  if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); const n = current[Math.max(0, idx - 1)]; if (n) openItem(n.id); }
  if (e.key === 'Escape') { $('#detail')?.classList.remove('open'); }
  if (e.key === 's' && state.sel) { e.preventDefault(); const it = byId.get(state.sel); if (it && !isSpam(it)) await markSpam(state.sel); return; }
  if (e.key === 'c' && state.sel) { e.preventDefault(); $('#chatIn')?.focus(); $('#chatIn')?.scrollIntoView({ block: 'center' }); return; }
  if (e.key === 'd' && state.sel) { e.preventDefault(); const sd = $('details[data-sec="dups"]'); if (sd) sd.open = true; const ds = $('#dupSearch'); if (ds) { ds.focus(); ds.scrollIntoView({ block: 'center' }); } return; }
  const LETTER = { a: 'reviewed', p: 'planned', x: 'wontfix', f: 'fixed' };
  const num = LETTER[e.key] ? STATUSES.indexOf(LETTER[e.key]) + 1 : Number(e.key);
  if (num >= 1 && num <= 6 && state.sel) {
    const id = state.sel, st = STATUSES[num - 1];
    await patch(id, { status: st }, `Marked as ${STATUS[st]}`);
    const next = state.tab === 'inbox' && st !== 'new' ? current[idx + 1] || current[idx - 1] : null;
    if (next) state.sel = next.id;
    refresh(state.sel);
  }
});

let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (state.mode === 'simple' || state.tab === 'insights') render(); else fitWork(); }, 150); });

// ---------- Load ----------
async function load() {
  const [info, list] = await Promise.all([call('/api/me'), call('/api/items')]);
  items = list; tokCache.clear(); rebuild();
  me = info.user;
  const av = $('#avatar');
  if (me?.avatar) av.src = me.avatar; else av.style.display = 'none';
  av.title = me?.name || '';
  $('#synced').textContent = info.last_sync ? `Synced ${ago(info.last_sync)}` : 'Not synced yet';
  const sel = state.sel;
  render();
  if (sel && byId.has(sel) && state.mode === 'advanced') openItem(sel, { keep: true });
}
load().catch((e) => { $('#app').innerHTML = `<div class="empty"><b>Couldn't load feedback</b>${esc(e.message)}</div>`; });
setInterval(() => { if (!document.hidden && !document.activeElement?.matches('input,textarea,select')) load().catch(() => {}); }, 120000);
</script>
</body>
</html>
